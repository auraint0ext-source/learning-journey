<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <title>My 1st Project</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1 id="welcomeText">Hellow Guys! It's a self skill Development Challange. I hope I could achive it.</h1>
   <br>
    <!-- ইউজারের নাম লেখার জন্য ইনপুট ফিল্ড -->
    <input type="text" id="nameInput" placeholder="Enter your name here">
    <br><br>
    <!-- একটি ক্লিক করার মতো বাটন যোগ করা হলো -->
    <button onclick="updateGreeting()">Writedown your Name</button>

    <!-- JavaScript কোড -->
 <script>
        function updateGreeting() {
            // ইনপুট বক্স থেকে ইউজারের লেখা নাম সংগ্রহ করা
            let userName = document.getElementById("nameInput").value;
            
            // যদি ইনপুট খালি না থাকে, তবে হেডিং পরিবর্তন করা
            if (userName) {
                document.getElementById("welcomeText").innerText = "Welcome, " + userName + "! Have a great journey of learning.";
            } else {
                alert("Please enter your name before clicking the button.");
            }
        }
    </script>

</body>
</html>
